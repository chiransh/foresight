name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU torch first, explicitly. NeuralForecast pulls torch, and the default
      # PyPI wheel for Linux carries the CUDA runtime, which is gigabytes of
      # download for a runner with no GPU.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # The dev extra includes the train extra, so Prophet and NeuralForecast are
      # installed: the test suite imports the baselines through foresight.backtest.
      - run: pip install -e ".[dev]"

      # The tests train small models on the committed data sample rather than the
      # full Rossmann dataset, which is gitignored and not redistributable.
      - run: pytest -q
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
