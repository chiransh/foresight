[project]
name = "foresight"
version = "0.1.0"
description = "Demand forecasting service with model comparison, backtesting, and drift-triggered retraining"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "prophet>=1.1",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "neuralforecast>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyter>=1.0",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
foresight-baseline-prophet = "foresight.baselines.prophet_baseline:main"
foresight-baseline-lightgbm = "foresight.baselines.lightgbm_baseline:main"
foresight-baseline-nhits = "foresight.baselines.nhits_baseline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
