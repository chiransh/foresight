[project]
name = "foresight"
version = "0.1.0"
description = "Demand forecasting service with model comparison, backtesting, and drift-triggered retraining"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Base install is what the API needs to serve a forecast and nothing more.
# Prophet pulls cmdstan and NeuralForecast pulls torch, which together add
# well over a gigabyte to an image that never runs either of them.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "joblib>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Everything needed to train and benchmark the models, which the serving
# image deliberately does not install.
train = [
    "apscheduler>=3.10",
    "prophet>=1.1",
    "neuralforecast>=2.0",
    "mlflow>=3.0",
    "matplotlib>=3.8",
]
dev = [
    "foresight[train]",
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyter>=1.0",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "httpx>=0.27",
]

[project.scripts]
foresight-baseline-prophet = "foresight.baselines.prophet_baseline:main"
foresight-baseline-lightgbm = "foresight.baselines.lightgbm_baseline:main"
foresight-baseline-nhits = "foresight.baselines.nhits_baseline:main"
foresight-backtest = "foresight.backtest:main"
foresight-train-model = "foresight.serving.model:main"
foresight-retrain = "foresight.retraining:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
